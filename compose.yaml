services:
  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Set a reviewed Python 3.13 image digest}
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the HTTPS public origin}
      ACCESS_ISSUER: ${ACCESS_ISSUER:?Set the Cloudflare Access team origin}
      ACCESS_AUDIENCE: ${ACCESS_AUDIENCE:?Set the Access application AUD tag}
      HOSTED_ROOT: /var/lib/algotrading
    volumes:
      - hosted-data:/var/lib/algotrading
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',8000),2).close()"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '5'}

  tunnel:
    image: ${CLOUDFLARED_IMAGE:?Set a reviewed cloudflared image digest}
    user: '10001:10001'
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel-token]
    secrets:
      - tunnel-token
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '5'}

volumes:
  hosted-data:

secrets:
  tunnel-token:
    file: ./secrets/tunnel-token
